---
- name: Create Proxmox LXC container
  community.proxmox.proxmox:

    # API connection
    api_host: "{{ proxmox_api_host }}"
    api_port: "{{ proxmox_api_port }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    validate_certs: "{{ proxmox_validate_certs }}"


    # Placement
    node: "{{ proxmox_node }}"


    # Identity
    vmid: "{{ proxmox_container_vmid }}"
    hostname: "{{ proxmox_container_hostname }}"


    # Template
    ostemplate: >-
      {{ proxmox_container_template_storage }}:vztmpl/{{ proxmox_container_template }}


    # Root filesystem
    disk_volume:
      storage: "{{ proxmox_container_storage }}"
      size: "{{ proxmox_container_disk_size }}"


    # Resources
    cores: "{{ proxmox_container_cores }}"
    cpus: "{{ proxmox_container_cpus }}"
    cpuunits: "{{ proxmox_container_cpuunits | default(omit) }}"
    memory: "{{ proxmox_container_memory }}"
    swap: "{{ proxmox_container_swap }}"


    # Authentication
    password: "{{ proxmox_container_password | default(omit) }}"
    pubkey: "{{ proxmox_container_ssh_key | default(omit) }}"


    # Network
    netif:
      net0: "name=eth0,bridge={{ proxmox_container_bridge }},ip={{ proxmox_container_ip }}/{{ proxmox_container_prefix }},gw={{ proxmox_container_gateway }}"


    # DNS
    nameserver: "{{ proxmox_container_nameserver | default(omit) }}"
    searchdomain: "{{ proxmox_container_searchdomain | default(omit) }}"


    # Container options
    features: "{{ proxmox_container_features | default(omit) }}"
    unprivileged: "{{ proxmox_container_unprivileged }}"


    # Startup
    onboot: "{{ proxmox_container_onboot }}"
    startup: "{{ proxmox_container_startup }}"


    # Metadata
    description: "{{ proxmox_container_description | default(omit) }}"
    tags: "{{ proxmox_container_tags | default(omit) }}"


    # OS
    ostype: "{{ proxmox_container_ostype }}"
    timezone: "{{ proxmox_container_timezone }}"


    # Advanced
    hookscript: >-
      {{ proxmox_container_hookscript
        if proxmox_container_hookscript | default('', true) | length > 0
        else omit }}
    mounts: "{{ proxmox_container_mounts if proxmox_container_mounts | length > 0 else omit }}"


    # Behaviour
    state: present
    timeout: "{{ proxmox_container_timeout }}"
  